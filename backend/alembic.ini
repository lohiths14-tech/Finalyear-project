# AgriPulse 2.0 — Alembic Migration Configuration
# ================================================
[alembic]
# Path to migration scripts directory
script_location = alembic

# Template for new revision filenames
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s

# Timezone for timestamps in revision filenames
timezone = UTC

# Database URL — reads from DATABASE_URL environment variable at runtime.
# The actual value is injected in alembic/env.py via os.environ["DATABASE_URL"]
# to avoid committing credentials here.
sqlalchemy.url = %(DATABASE_URL)s

[post_write_hooks]
# Automatically format migration files with black + isort
# hooks = black, isort
# black.type = console_scripts
# black.entrypoint = black
# isort.type = console_scripts
# isort.entrypoint = isort

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %%H:%%M:%%S

[alembic:exclude]
tables =
